name: 同步 TVBox 源到 Gitee

# 每天北京时间 06:10 自动执行；之后电视端完全不需要电脑
# 产物发布到本仓库的 publish 分支，再由 jsDelivr 国内镜像分发，电视直连镜像即可
on:
  schedule:
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: write   # 需要把产物推到本仓库的 publish 分支

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库(拿到 build-config.ps1)
        uses: actions/checkout@v4
        with:
          path: src

      - name: 准备发布工作区
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p publish && cd publish
          git init -q
          git config user.name  "tvbox-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 每次都做成一条全新历史，仓库体积不会一天天膨胀
          git checkout -B publish
          git clean -fdx
          echo "*.raw.json" > .gitignore
          echo "已就绪：publish 分支工作区"

      - name: 拉取最新配置
        run: |
          set -e
          cd publish
          BASE=https://raw.githubusercontent.com/qist/tvbox/master
          mkdir -p live jar lib js cat FTY json
          for n in js 0827 367 fty 9918; do
            curl -fsSL --retry 3 "$BASE/$n.json" -o "$n.raw.json"
          done
          echo "已拉取 5 份原始配置"

      - name: 扫描并下载配置引用的全部相对资源
        run: |
          set -e
          cd publish
          BASE=https://raw.githubusercontent.com/qist/tvbox/master
          # 从原始 JSON 里抓出所有 "./xxx" 字符串，切掉 $$$参数 与 ;md5; 后缀
          grep -ohE '"\./[^"]*"' ./*.raw.json \
            | sed 's/^"//; s/"$//' \
            | awk -F'[$;]' '{print $1}' | sed 's|^\./||' | sort -u > need.txt
          echo "需要下载 $(wc -l < need.txt) 个相对资源"
          while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            mkdir -p "$(dirname "$rel")"
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$rel")
            if curl -fsSL --retry 2 "$BASE/$enc" -o "$rel"; then
              echo "  ok   $rel"
            else
              rm -f "$rel"
              echo "  skip $rel (上游不存在)"
            fi
          done < need.txt
          # jsDelivr 会屏蔽 .jar 后缀（返回 403 Forbidden），但影视仓本地缓存名是 md5(url)+".jar"
          # （Path.jar），远端文件名无所谓，所以复制一份 .bin 出来给 CDN 发
          for f in jar/*.jar; do
            [ -e "$f" ] || continue
            cp "$f" "${f%.jar}.bin"
            echo "  改名 ${f%.jar}.bin"
          done

      - name: 生成配置（相对路径 → 绝对 URL）
        run: |
          set -e
          cd publish
          RAW="https://cdn.jsdmirror.com/gh/${GITHUB_REPOSITORY}@publish"
          SPEC='直播·移动CDN(全)|./tvlive.txt;直播·央视卫视(精简)|./live/list.txt;直播·每日有效源(过滤后)|./live/bbxx365.txt;广播·电台|./live/radio.txt'
          for n in 0827 367 fty 9918; do
            pwsh -NoProfile -File ../src/build-config.ps1 -Source "$n.raw.json" -Base "$RAW/" -Out "alt-$n.json" -LiveSpec "$SPEC" -SpiderExt ".bin"
          done
          pwsh -NoProfile -File ../src/build-config.ps1 -Source js.raw.json -Base "$RAW/" -Out fongmi-main.json -LiveSpec "$SPEC" -SpiderExt ".bin"
          # 直播源文件
          BASE=https://raw.githubusercontent.com/qist/tvbox/master
          curl -fsSL --retry 3 "$BASE/tvlive.txt" -o tvlive.txt
          for f in list.txt ITV.txt zb.txt radio.txt; do curl -fsSL --retry 3 "$BASE/$f" -o "live/$f"; done
          curl -fsSL --retry 3 https://raw.githubusercontent.com/kimwang1978/collect-txt/main/bbxx365.txt       -o live/bbxx365.txt
          curl -fsSL --retry 3 https://raw.githubusercontent.com/kimwang1978/collect-txt/main/bbxx365_lite.txt -o live/bbxx365_lite.txt
          curl -fsSL --retry 3 https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u        -o live/fanmingming-ipv6.m3u
          ls -la *.json | head -20

      - name: 校验（无相对路径 / ext 结构 / 无 BOM / MD5 一致）
        run: |
          set -e
          cd publish
          pwsh -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            $c = Get-Content fongmi-main.json -Raw -Encoding UTF8 | ConvertFrom-Json
            $bad = 0
            if ($c.spider -match "^\./") { $bad++ }
            foreach ($s in $c.sites) { if ($s.api -match "^\./") { $bad++ }; if ($s.ext -match "^\./") { $bad++ } }
            foreach ($l in $c.lives)  { if ($l.url -match "^\./") { $bad++ } }
            if ($bad -gt 0) { throw "仍有 $bad 处相对路径" }
            Write-Host "  无相对路径 OK"
            $broken = 0
            foreach ($s in $c.sites) { if ($s.ext -is [string] -and $s.ext -match "^[@\{]") { $broken++ } }
            if ($broken -gt 0) { throw "$broken 个站点的 ext 结构损坏" }
            Write-Host "  ext 结构 OK"
            $bytes = [System.IO.File]::ReadAllBytes("fongmi-main.json")
            if ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) { throw "检测到 BOM" }
            Write-Host "  无 BOM OK"
            $decl = ($c.spider -split ";md5;")[1]
            Write-Host "  spider = $($c.spider)"
            if ($c.spider -notmatch "\.bin") { throw "spider 没有改成 .bin 后缀" }
            $act = (Get-FileHash jar/pg_upgraded.bin -Algorithm MD5).Hash.ToLower()
            Write-Host "  MD5 声明=$decl 实际=$act"
            if ($decl -ne $act) { throw "MD5 不一致" }
            Write-Host "  MD5 一致 OK"
          '

      - name: 发布到 GitHub publish 分支（jsDelivr 镜像由此分发）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd publish
          git add -A
          git commit -q -m "publish $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "无变化"
          git push --force origin publish
          echo "已发布到 publish 分支"

      - name: 镜像到 Gitee（尽力而为，失败不影响主链路）
        continue-on-error: true
        timeout-minutes: 25
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set -e
          OWNER="${GITEE_REPO%%/*}"
          export GIT_TERMINAL_PROMPT=0
          git clone --depth 1 "https://${OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" gitee-mirror
          cd gitee-mirror
          git config user.name  "tvbox-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote set-url origin "https://${OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          # 复制资源
          cp -r ../publish/jar ../publish/lib ../publish/js ../publish/json ../publish/FTY ../publish/live . 2>/dev/null || true
          cp ../publish/tvlive.txt .
          # 用 Gitee 基准重新生成一份配置，保证 Gitee 这份自洽
          RAW="https://gitee.com/${GITEE_REPO}/raw/master"
          SPEC='直播·移动CDN(全)|./tvlive.txt;直播·央视卫视(精简)|./live/list.txt;直播·每日有效源(过滤后)|./live/bbxx365.txt;广播·电台|./live/radio.txt'
          cp ../publish/*.raw.json .
          for n in 0827 367 fty 9918; do
            pwsh -NoProfile -File ../src/build-config.ps1 -Source "$n.raw.json" -Base "$RAW/" -Out "alt-$n.json" -LiveSpec "$SPEC" -SpiderExt ".bin"
          done
          pwsh -NoProfile -File ../src/build-config.ps1 -Source js.raw.json -Base "$RAW/" -Out fongmi-main.json -LiveSpec "$SPEC" -SpiderExt ".bin"
          rm -f *.raw.json
          # 安装包也放 Gitee：电视浏览器可直接下载，实现"连电脑都不用碰"
          APK=FongMi-TV-5.8.5-leanback-arm64_v8a.apk
          if [ ! -f "$APK" ]; then
            curl -fsSL --retry 3 \
              "https://github.com/FongMi/Release/releases/download/5.8.5/leanback-arm64_v8a.apk" -o "$APK" \
              || echo "  安装包下载失败，跳过"
          fi
          ls -la "$APK" 2>/dev/null || true
          git add -A
          git commit -q -m "同步 $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "无变化"
          git -c http.postBuffer=524288000 push origin HEAD:master
          echo "已镜像到 Gitee"

      - name: 输出电视端应填的地址
        run: |
          echo "--------------------------------------------------"
          echo "电视端订阅地址（任选一条，都是同一份内容）："
          echo "  https://jsdelivr.b-cdn.net/gh/${{ github.repository }}@publish/fongmi-main.json   （最快，推荐）"
          echo "  https://cdn.jsdmirror.com/gh/${{ github.repository }}@publish/fongmi-main.json"
          echo "  https://gcore.jsdelivr.net/gh/${{ github.repository }}@publish/fongmi-main.json"
          echo "  https://testingcf.jsdelivr.net/gh/${{ github.repository }}@publish/fongmi-main.json"
          echo "  https://gitee.com/${{ secrets.GITEE_REPO }}/raw/master/fongmi-main.json   (镜像，可能被风控 451)"
          echo ""
          echo "安装包下载地址（电视浏览器直接下载，免电脑）："
          echo "  https://gitee.com/${{ secrets.GITEE_REPO }}/raw/master/FongMi-TV-5.8.5-leanback-arm64_v8a.apk"
          echo "--------------------------------------------------"
